name: Build Android APK

on:
  push:
    branches: [ main ] # Automatically builds when you push to main
  workflow_dispatch: # Allows you to manually click a "Build" button on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: ☕ Setup Java 21 (Cloud LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗️ Build Web App
        working-directory: ./client
        run: |
          # 1. Nuke ghost workspace files at the root and client level
          rm -f ../pnpm-workspace.yaml
          rm -f pnpm-workspace.yaml
          
          # 2. Write environment variables
          echo "${{ secrets.FRONTEND_ENV }}" > .env
          
          # 3. Brutal force install (ignores workspace rules completely)
          pnpm install --ignore-workspace --no-frozen-lockfile
          
          # 4. Build Vite App
          pnpm run build
          
          # 5. Ensure folder exists, then inject native Google Auth bridge
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          
          # 6. Sync Capacitor
          npx cap sync android

      - name: 🤖 Compile Native Android APK
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: zync-android-app
          path: client/android/app/build/outputs/apk/debug/app-debug.apk