name: Build Android APK

on:
  push:
    branches: [ main ] # Automatically builds when you push to main
  workflow_dispatch: # Allows you to manually click a "Build" button on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: ☕ Setup Java 21 (Cloud LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🏗️ Build Web App
        working-directory: ./client
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" > .env
          pnpm install
          pnpm run build
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          npx cap sync android

      - name: 🤖 Compile Native Android APK
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: zync-android-app
          path: client/android/app/build/outputs/apk/debug/app-debug.apk